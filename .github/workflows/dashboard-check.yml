name: Dashboard Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: node --check docs/app.js
      - run: python -c "import json; json.load(open('config/products.json')); json.load(open('config/stores.json')); print('Config JSON OK')"
