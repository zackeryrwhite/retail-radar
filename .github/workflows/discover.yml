name: Discover Products
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover Pokémon product candidates
        env:
          SCAVIO_API_KEY: ${{ secrets.SCAVIO_API_KEY }}
        run: python -m app.discover_products
