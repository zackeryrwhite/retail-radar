name: Inventory Monitor
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: retail-radar-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run inventory checks
        env:
          SCAVIO_API_KEY: ${{ secrets.SCAVIO_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m app.monitor
      - name: Save inventory state
        run: |
          git config user.name "retail-radar[bot]"
          git config user.email "retail-radar[bot]@users.noreply.github.com"
          git add data/state.json data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update inventory observations"
            git push
          fi
